  <script>
    // Function to process URL through Zapier for enhanced product information
    async function processUrlWithZapier(url) {
      // Show loading indicator
      const searchBox = document.querySelector('.gsc-input');
      const originalValue = searchBox.value;
      searchBox.value = 'Processing product information...';
      
      try {
        // Replace this URL with your actual Zapier Webhook URL
        const zapierWebhookUrl = 'https://hooks.zapier.com/hooks/catch/YOUR_ZAPIER_WEBHOOK_ID/'; 
        
        // Send the URL to Zapier
        const response = await fetch(zapierWebhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ product_url: url })
        });
        
        if (!response.ok) {
          throw new Error('Failed to process URL');
        }
        
        // Get the processed data back from Zapier
        const data = await response.json();
        
        // Use the extracted information for search
        if (data.product_title) {
          // Create a more effective search query using the extracted information
          let searchQuery = data.product_title;
          
          if (data.brand_name) {
            searchQuery += ' ' + data.brand_name;
          }
          
          // Add any other relevant extracted information
          if (data.product_category) {
            searchQuery += ' ' + data.product_category;
          }
          
          // Update the search box with the enhanced query
          searchBox.value = searchQuery;
          
          // Trigger the search
          document.querySelector('.gsc-search-button').click();
          
          // Return the processed data for potential further use
          return data;
        } else {
          // If no product title was extracted, revert to original URL
          searchBox.value = originalValue;
          return null;
        }
      } catch (error) {
        console.error('Error processing URL with Zapier:', error);
        // Revert to original URL on error
        searchBox.value = originalValue;
        return null;
      }
    }
    
    // Function to modify all search result links to go through affiliate URL first
    function modifySearchResultLinks() {
      // The affiliate URL to redirect through
      const affiliateUrl = 'https://sale.dhgate.com/92xVti99';
      
      // Wait for search results to load
      const observer = new MutationObserver(function(mutations) {
        // Look for all result links
        const resultLinks = document.querySelectorAll('.gs-title a.gs-title, .gs-visibleUrl, .gs-image-thumbnail-container a, .gs-image');
        
        resultLinks.forEach(function(link) {
          // Only modify if not already modified
          if (!link.getAttribute('data-modified')) {
            const originalHref = link.getAttribute('href');
            if (originalHref && !originalHref.includes(affiliateUrl)) {
              // Create a function to handle the click
              link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // First redirect to affiliate URL with original URL as parameter
                // This creates a two-step redirect: affiliate URL -> original URL
                // Open in a new tab
                window.open(affiliateUrl + '?redirect=' + encodeURIComponent(originalHref), '_blank');
                
                return false;
              });
              
              // Set target to _blank to open in new tab
              link.setAttribute('target', '_blank');
              
              // Mark as modified to avoid duplicate handlers
              link.setAttribute('data-modified', 'true');
            }
          }
        });
      });
      
      // Start observing the document for changes
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
    
    // Run the function when the page loads
    window.addEventListener('load', modifySearchResultLinks);
    
    // Also run when Google search results are updated
    document.addEventListener('DOMContentLoaded', function() {
      // Check if Google search has loaded
      if (typeof google !== 'undefined' && google.search && google.search.cse) {
        // Add listener for when search results are rendered
        if (google.search.cse.element) {
          google.search.cse.element.on('rendered', function() {
            modifySearchResultLinks();
          });
        }
      }
    });
  </script>
  <script>
    // Function to handle custom URL search functionality
    function setupUrlSearchHandler() {
      // Wait for the search box to be available
      const observer = new MutationObserver(function(mutations) {
        const searchForm = document.querySelector('.gsc-search-box');
        const searchInput = document.querySelector('.gsc-input');
        
        if (searchForm && searchInput && !searchForm.getAttribute('data-url-handler')) {
          // Mark as modified to avoid duplicate handlers
          searchForm.setAttribute('data-url-handler', 'true');
          
          // Add event listener for paste events directly on the input
          searchInput.addEventListener('paste', function(e) {
            // Get pasted content
            let pastedText;
            if (window.clipboardData && window.clipboardData.getData) {
              pastedText = window.clipboardData.getData('Text');
            } else if (e.clipboardData && e.clipboardData.getData) {
              pastedText = e.clipboardData.getData('text/plain');
            }
            
            // Check if pasted content is a URL
            if (pastedText && isValidUrl(pastedText)) {
              // Let the paste happen normally
              setTimeout(function() {
                // Now handle the URL
                handleUrlInput(pastedText, searchInput, searchForm);
              }, 10);
            }
          });
          
          // Add event listener to the form submission
          searchForm.addEventListener('submit', function(e) {
            const inputValue = searchInput.value.trim();
            
            // Check if the input is a URL
            if (isValidUrl(inputValue)) {
              e.preventDefault(); // Prevent default search
              handleUrlInput(inputValue, searchInput, searchForm);
            }
          });
          
          // Add a placeholder text to indicate URL search capability
          if (searchInput) {
            searchInput.setAttribute('placeholder', 'Search or paste product URL...');
          }
          
          // Stop observing once we've set up the handler
          observer.disconnect();
        }
      });
      
      // Start observing the document for changes
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
    
    // Helper function to handle URL input
    function handleUrlInput(url, searchInput, searchForm) {
      console.log('Handling URL:', url);
      
      // Special handling for Nike URLs
      if (url.includes('nike.com')) {
        try {
          const urlObj = new URL(url);
          const path = urlObj.pathname;
          
          // Nike URLs follow pattern: /t/product-name-id/product-code
          const pathParts = path.split('/');
          if (pathParts.length >= 4) {
            // Get product name from URL
            let productName = '';
            if (pathParts[2]) {
              productName = pathParts[2].replace(/-/g, ' ');
            }
            
            // Combine information
            let searchQuery = 'Nike ' + productName;
            if (productName.toLowerCase().includes('air force')) {
              searchQuery = 'Nike Air Force 1';
            } else if (productName.toLowerCase().includes('air jordan')) {
              const jordanMatch = productName.match(/air\s+jordan\s+(\d+)/i);
              if (jordanMatch && jordanMatch[1]) {
                searchQuery = 'Nike Air Jordan ' + jordanMatch[1];
              } else {
                searchQuery = 'Nike Air Jordan';
              }
            } else if (productName.toLowerCase().includes('dunk')) {
              searchQuery = 'Nike Dunk';
            }
            
            // Update search input and trigger search
            searchInput.value = searchQuery + ' site:dhgate.com';
            setTimeout(function() {
              const searchButton = document.querySelector('.gsc-search-button');
              if (searchButton) {
                searchButton.click();
              }
            }, 100);
            
            return;
          }
        } catch (error) {
          console.error('Error processing Nike URL:', error);
        }
      }
      
      // For other URLs, use Zapier integration
      processUrlWithZapier(url);
    }

      try {
        new URL(string);
        return true;
      } catch (_) {

      }
    }

            }
            
            // Update search input and trigger search
            searchInput.value = searchQuery + ' site:dhgate.com';
            setTimeout(function() {
              const searchButton = document.querySelector('.gsc-search-button');
              if (searchButton) {
                searchButton.click();
              }
            }, 100);
            
            return null;
          }
        }
        
        // Try multiple proxy services in case one fails
        const proxyServices = [
          { name: 'allorigins', url: 'https://api.allorigins.win/raw?url=' },
          { name: 'corsproxy', url: 'https://corsproxy.io/?' }
        ];
        
        // Try the first proxy service
        tryFetchWithProxy(0);
        
        function tryFetchWithProxy(index) {
          if (index >= proxyServices.length) {
            // All proxies failed, try direct URL parsing
            extractFromUrlDirectly(urlObj);
            return;
          }
          
          const proxy = proxyServices[index];
          const proxyUrl = proxy.url + encodeURIComponent(url);
          
          fetch(proxyUrl)
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(html => processHtml(html))
            .catch(error => {
              console.error(`Error with ${proxy.name}:`, error);
              // Try next proxy
              tryFetchWithProxy(index + 1);
            });
        }
        
        function processHtml(html) {
          // Create a temporary DOM element to parse the HTML
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          
          // Extract product information from meta tags
          let title = '';
          let brand = '';
          
          // Try to get the title
          const metaTitle = doc.querySelector('meta[property="og:title"]');
          const metaProductName = doc.querySelector('meta[property="product:title"], meta[property="og:product_name"], meta[name="product-name"]');
          const pageTitle = doc.querySelector('title');
          
          if (metaTitle) {
            title = metaTitle.getAttribute('content');
          } else if (metaProductName) {
            title = metaProductName.getAttribute('content');
          } else if (pageTitle) {
            title = pageTitle.textContent;
          }
          
          // Try to get the brand
          const metaBrand = doc.querySelector('meta[property="product:brand"], meta[property="og:brand"], meta[name="brand"]');
          
          if (metaBrand) {
            brand = metaBrand.getAttribute('content');
          }
          
          // Try to get product details from structured data
          try {
            const structuredData = Array.from(doc.querySelectorAll('script[type="application/ld+json"]'));
            for (const dataScript of structuredData) {
              try {
                const data = JSON.parse(dataScript.textContent);
                if (data['@type'] === 'Product' || (data['@graph'] && data['@graph'].some(item => item['@type'] === 'Product'))) {
                  const product = data['@type'] === 'Product' ? data : data['@graph'].find(item => item['@type'] === 'Product');
                  
                  if (product) {
                    if (!title && product.name) {
                      title = product.name;
                    }
                    if (!brand && product.brand && product.brand.name) {
                      brand = product.brand.name;
                    }
                  }
                }
              } catch (e) {
                console.error('Error parsing structured data:', e);
              }
            }
          } catch (e) {
            console.error('Error processing structured data:', e);
          }
          
          // Try to extract from common product page elements if metadata approach failed
          if (!title) {
            // Look for common product title elements
            const possibleTitleElements = [
              doc.querySelector('h1.product-title'),
              doc.querySelector('h1.product-name'),
              doc.querySelector('h1.product_title'),
              doc.querySelector('h1.productTitle'),
              doc.querySelector('h1[itemprop="name"]'),
              doc.querySelector('h1')  // Last resort: just take the first h1
            ];
            
            for (const element of possibleTitleElements) {
              if (element && element.textContent.trim()) {
                title = element.textContent.trim();
                break;
              }
            }
          }
          
          // If brand is still empty, try to infer from domain
          if (!brand) {
            const domainBrands = {
              'nike': 'Nike',
              'adidas': 'Adidas',
              'puma': 'Puma',
              'newbalance': 'New Balance',
              'underarmour': 'Under Armour',
              'reebok': 'Reebok'
            };
            
            for (const [brandKey, brandName] of Object.entries(domainBrands)) {
              if (domain.includes(brandKey)) {
                brand = brandName;
                break;
              }
            }
          }
          
          // Combine brand and title if available
          let extractedInfo = '';
          if (brand) extractedInfo += brand + ' ';
          if (title) extractedInfo += title;
          
          // If we found information, use it for the search
          if (extractedInfo) {
            // Clean up the extracted info
            extractedInfo = extractedInfo.trim()
                                      .replace(/\s+/g, ' ')
                                      .replace(/[^a-zA-Z0-9\s]/g, ' ')
                                      .trim();
            
            // Update the search input
            searchInput.value = extractedInfo + ' site:dhgate.com';
            
            // Trigger the search
            setTimeout(function() {
              const searchButton = document.querySelector('.gsc-search-button');
              if (searchButton) {
                searchButton.click();
              }
            }, 100);
          } else {
            // If all extraction methods failed, try URL parsing
            extractFromUrlDirectly(urlObj);
          }
        }
        
        function extractFromUrlDirectly(urlObj) {
          // Extract product info from URL parts
          const pathSegments = urlObj.pathname.split('/');
          
          // Remove empty segments and common words
          const filteredSegments = pathSegments.filter(segment => {
            const s = segment.toLowerCase();
            return s && s.length > 2 && 
                   !['www', 'com', 'net', 'org', 'product', 'item', 'p', 'products', 'shop', 't'].includes(s);
          });
          
          let productInfo = '';
          
          // Try to infer brand from domain
          const domainParts = urlObj.hostname.split('.');
          const possibleBrand = domainParts[0] !== 'www' ? domainParts[0] : domainParts[1];
          if (possibleBrand && !['com', 'net', 'org', 'io'].includes(possibleBrand)) {
            productInfo += possibleBrand + ' ';
          }
          
          // Extract words from path segments
          for (const segment of filteredSegments) {
            // Replace hyphens and underscores with spaces
            const words = segment.replace(/[-_]/g, ' ');
            if (words && words.length > 2) {
              productInfo += ' ' + words;
            }
          }
          
          // Clean up the product info
          productInfo = productInfo.trim()
                                  .replace(/\s+/g, ' ')
                                  .replace(/[^a-zA-Z0-9\s]/g, ' ')
                                  .trim();
          
          if (productInfo) {
            searchInput.value = productInfo + ' site:dhgate.com';
            setTimeout(function() {
              const searchButton = document.querySelector('.gsc-search-button');
              if (searchButton) {
                searchButton.click();
              }
            }, 100);
          } else {
            searchInput.value = 'Could not extract product info. Please try a different URL or search manually.';
          }
        }
        
        // Return null since we're handling the search asynchronously
        return null;
      } catch (error) {
        console.error('Error extracting product info:', error);
        const searchInput = document.querySelector('.gsc-input');
        if (searchInput) {
          searchInput.value = 'Error processing URL. Please try a different URL or search manually.';
        }
        return null;
      }
    }
    
    // Function to hide logo and tagline when search results are shown
    function setupLogoVisibility() {
      // Create a MutationObserver to watch for changes in the DOM
      const observer = new MutationObserver(function(mutations) {
        // Check if search results are visible
        const searchResults = document.querySelector('.gsc-results-wrapper-overlay.gsc-results-wrapper-visible');
        const logoContainer = document.querySelector('.logo-container');
        const tagline = document.querySelector('.tagline');
        
        if (logoContainer) {
          if (searchResults) {
            // Hide logo and tagline when search results are visible
            logoContainer.style.display = 'none';
          } else {
            // Show logo and tagline when search results are not visible
            logoContainer.style.display = 'block';
          }
        }
      });
      
      // Start observing the DOM
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
      
      // Also check when the search button is clicked
      const searchButton = document.querySelector('.gsc-search-button');
      if (searchButton) {
        searchButton.addEventListener('click', function() {
          // Hide logo container immediately when search button is clicked
          const logoContainer = document.querySelector('.logo-container');
          if (logoContainer) {
            logoContainer.style.display = 'none';
          }
        });
      }
      
      // Add event listener to the search input for when Enter key is pressed
      const searchInput = document.querySelector('.gsc-input');
      if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            // Hide logo container immediately when Enter is pressed in search input
            const logoContainer = document.querySelector('.logo-container');
            if (logoContainer) {
              logoContainer.style.display = 'none';
            }
          }
        });
      }
    }
    
    // Run the setup when the page loads
    window.addEventListener('load', function() {
      setupUrlSearchHandler();
      setupLogoVisibility();
    });
    
    // Also run when Google search results are updated
    document.addEventListener('DOMContentLoaded', function() {
      setupUrlSearchHandler();
      setupLogoVisibility();
    });
  </script>
